services:
  xaita-ot:
    build: .
    ports:
      - "8080:8080"
    environment:
      XAITA_ENV: ${XAITA_ENV:-development}
      XAITA_ENABLE_DOCS: ${XAITA_ENABLE_DOCS:-true}
      XAITA_ALLOWED_HOSTS: ${XAITA_ALLOWED_HOSTS:-127.0.0.1,localhost}
      XAITA_FORCE_HTTPS: ${XAITA_FORCE_HTTPS:-false}
      XAITA_MAX_EVENTS: ${XAITA_MAX_EVENTS:-5000}
      XAITA_RATE_LIMIT_PER_MINUTE: ${XAITA_RATE_LIMIT_PER_MINUTE:-30}
      XAITA_MAX_REQUEST_BYTES: ${XAITA_MAX_REQUEST_BYTES:-8388608}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
