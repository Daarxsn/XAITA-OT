name: XAITA-OT V5 Operational Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  operational-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Run operational-check tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_v5_operational_check.py
      - name: Run deployment preflight
        run: python scripts/v5_preflight.py --json
