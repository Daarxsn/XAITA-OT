name: XAITA-OT V5 Security Evidence

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  sast:
    name: Python SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install SAST tooling
        run: python -m pip install --upgrade pip bandit[toml]
      - name: Run Bandit
        run: |
          mkdir -p artifacts/security
          bandit -r src -c pyproject.toml -lll -iii -f json -o artifacts/security/bandit.json

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install .
      - name: Install pip-audit
        run: python -m pip install pip-audit
      - name: Audit installed dependencies
        run: |
          mkdir -p artifacts/security
          python -m pip_audit --format json --output artifacts/security/pip-audit.json

  container-and-config:
    name: Container and filesystem security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --tag xaita-ot:security-evidence .
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: artifacts/security/trivy-fs.json
          severity: CRITICAL,HIGH
          exit-code: "1"
      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: xaita-ot:security-evidence
          format: json
          output: artifacts/security/trivy-image.json
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  evidence-contract:
    name: Security evidence contract
    runs-on: ubuntu-latest
    needs: [sast, dependency-audit, container-and-config]
    steps:
      - uses: actions/checkout@v4
      - name: Validate security evidence contract
        run: python scripts/v5_security_evidence_check.py
