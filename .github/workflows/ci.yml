name: XAITA-OT CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q
      - name: Run V1 synthetic end-to-end smoke
        run: python scripts/run_v1_swat.py --csv data/demo/swat_like.csv --out artifacts/ci_v1.json --model-out artifacts/ci_v1.pt
      - name: Compile package
        run: python -m compileall -q src
