name: XAITA-OT CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q
      - name: Run V1 synthetic end-to-end smoke
        run: python scripts/run_v1_swat.py --csv data/demo/swat_like.csv --out artifacts/ci_v1.json --model-out artifacts/ci_v1.pt
      - name: Run V2 adapter smoke
        run: |
          python - <<'PY'
          import pandas as pd
          from xaita_ot.io.adapters import adapt_dataset
          fixtures = {
              "SWaT": ("Timestamp", "Label"),
              "BATADAL": ("DATETIME", "attack"),
              "TON-IoT": ("ts", "type"),
          }
          for dataset, (ts, label) in fixtures.items():
              values = [0] * 32 + [1] * 32 + [0] * 32
              frame = pd.DataFrame({ts: pd.date_range("2026-01-01", periods=len(values), freq="s"), label: values})
              if dataset == "SWaT":
                  frame[label] = frame[label].map({0: "Normal", 1: "Attack"})
              if dataset == "TON-IoT":
                  frame[label] = frame[label].map({0: "normal", 1: "attack"})
              out = adapt_dataset(frame, dataset)
              assert out["label"].sum() == 32
          print("V2 adapter smoke: PASS")
          PY
      - name: Compile package
        run: python -m compileall -q src
