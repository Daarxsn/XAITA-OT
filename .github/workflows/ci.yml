name: XAITA-OT CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q
      - name: Run V1 synthetic end-to-end smoke
        run: python scripts/run_v1_swat.py --csv data/demo/swat_like.csv --out artifacts/ci_v1.json --model-out artifacts/ci_v1.pt
      - name: Run V2 adapter smoke
        run: |
          python - <<'PY'
          import pandas as pd
          from xaita_ot.io.adapters import adapt_dataset
          fixtures = {
              "SWaT": ("Timestamp", "Label"),
              "BATADAL": ("DATETIME", "attack"),
              "TON-IoT": ("ts", "type"),
          }
          for dataset, (ts, label) in fixtures.items():
              values = [0] * 32 + [1] * 32 + [0] * 32
              frame = pd.DataFrame({ts: pd.date_range("2026-01-01", periods=len(values), freq="s"), label: values})
              if dataset == "SWaT": frame[label] = frame[label].map({0: "Normal", 1: "Attack"})
              if dataset == "TON-IoT": frame[label] = frame[label].map({0: "normal", 1: "attack"})
              out = adapt_dataset(frame, dataset)
              assert out["label"].sum() == 32
          print("V2 adapter smoke: PASS")
          PY
      - name: V3 Phase 1 leakage and reproducibility acceptance
        run: python scripts/run_v3_phase1.py --csv data/demo/swat_like.csv --dataset SWaT --out artifacts/v3/phase1
      - name: Upload V3 Phase 1 acceptance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-phase1-${{ matrix.python-version }}
          path: artifacts/v3/phase1
          if-no-files-found: error
      - name: V3 Phase 2 cross-environment acceptance
        run: python scripts/run_v3_phase2.py --swat data/demo/swat_like.csv --batadal data/demo/batadal_like.csv --toniot data/demo/toniot_like.csv --out artifacts/v3/phase2 --seed 42 --window-size 4 --epochs 1
      - name: Upload V3 Phase 2 acceptance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-phase2-${{ matrix.python-version }}
          path: artifacts/v3/phase2
          if-no-files-found: error
      - name: V3 Phase 3 calibration acceptance
        run: python scripts/run_v3_phase3.py --swat data/demo/swat_like.csv --batadal data/demo/batadal_like.csv --toniot data/demo/toniot_like.csv --out artifacts/v3/phase3 --seed 42 --bins 10 --window-size 4
      - name: Upload V3 Phase 3 acceptance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-phase3-${{ matrix.python-version }}
          path: artifacts/v3/phase3
          if-no-files-found: error
      - name: V3 Phase 4 ablation acceptance
        run: python scripts/run_v3_phase4.py --swat data/demo/swat_like.csv --batadal data/demo/batadal_like.csv --toniot data/demo/toniot_like.csv --out artifacts/v3/phase4 --seed 42 --window-size 4
      - name: Upload V3 Phase 4 acceptance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-phase4-${{ matrix.python-version }}
          path: artifacts/v3/phase4
          if-no-files-found: error
      - name: V3 Phase 5 sensitivity acceptance
        run: python scripts/run_v3_phase5.py --swat data/demo/swat_like.csv --batadal data/demo/batadal_like.csv --toniot data/demo/toniot_like.csv --out artifacts/v3/phase5 --seed 42 --window-size 4
      - name: Upload V3 Phase 5 acceptance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-phase5-${{ matrix.python-version }}
          path: artifacts/v3/phase5
          if-no-files-found: error
      - name: V3 Phase 6 statistical acceptance
        run: python scripts/run_v3_phase6.py --swat data/demo/swat_like.csv --batadal data/demo/batadal_like.csv --toniot data/demo/toniot_like.csv --out artifacts/v3/phase6 --seed 42 --seed 43 --seed 44 --window-size 4 --confidence 0.95
      - name: Upload V3 Phase 6 acceptance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-phase6-${{ matrix.python-version }}
          path: artifacts/v3/phase6
          if-no-files-found: error
      - name: V3 Phase 7 case-study acceptance
        run: python scripts/run_v3_phase7.py --swat data/demo/swat_like.csv --batadal data/demo/batadal_like.csv --toniot data/demo/toniot_like.csv --out artifacts/v3/phase7 --seed 42 --window-size 4 --top-n 1
      - name: Upload V3 Phase 7 acceptance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-phase7-${{ matrix.python-version }}
          path: artifacts/v3/phase7
          if-no-files-found: error
      - name: V3 Phase 8 automated result generation acceptance
        run: python scripts/run_v3_phase8.py --swat data/demo/swat_like.csv --batadal data/demo/batadal_like.csv --toniot data/demo/toniot_like.csv --artifact-root artifacts/v3 --out artifacts/v3/phase8 --seed 42
      - name: Upload V3 Phase 8 result artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-phase8-${{ matrix.python-version }}
          path: artifacts/v3/phase8
          if-no-files-found: error
      - name: Compile package
        run: python -m compileall -q src scripts
