name: XAITA-OT V4 API Smoke

on:
  push:
    branches: [v4-development]
  pull_request:
    branches: [v4-development]

jobs:
  api-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev]"
      - name: API import and endpoint smoke
        run: pytest -q tests/test_api.py
      - name: Compile API package
        run: python -m compileall -q src/xaita_ot/api run_api.py
