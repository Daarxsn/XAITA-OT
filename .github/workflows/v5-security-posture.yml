name: XAITA-OT V5 Security Posture

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-posture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run deployment security posture gate
        run: python scripts/v5_security_posture_check.py
      - name: Run posture regression
        run: python -m pip install -e ".[dev]" && python -m pytest -q tests/test_v59_security_posture.py
