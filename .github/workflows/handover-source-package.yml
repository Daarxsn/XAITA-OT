name: XAITA-OT Handover Source Package

on:
  push:
    branches:
      - handover/package-snapshot
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create exact-main source archive and repository bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p handover-output
          SOURCE_REV="$(git rev-parse origin/main)"
          echo "SOURCE_REV=$SOURCE_REV" >> "$GITHUB_ENV"
          git archive --format=zip --prefix=XAITA-OT/ "$SOURCE_REV" -o handover-output/XAITA-OT-source.zip
          git bundle create handover-output/XAITA-OT-repository.bundle --all
          git bundle verify handover-output/XAITA-OT-repository.bundle
          python - <<'PY'
          import hashlib, json, os, subprocess, zipfile
          from pathlib import Path
          rev = os.environ["SOURCE_REV"]
          zpath = Path("handover-output/XAITA-OT-source.zip")
          with zipfile.ZipFile(zpath) as archive:
              names = archive.namelist()
              files = [n for n in names if not n.endswith("/")]
              required = [
                  "XAITA-OT/README.md",
                  "XAITA-OT/pyproject.toml",
                  "XAITA-OT/src/xaita_ot/api/app.py",
                  "XAITA-OT/tests/test_api.py",
                  "XAITA-OT/data/demo/swat_like.csv",
                  "XAITA-OT/data/demo/batadal_like.csv",
                  "XAITA-OT/data/demo/toniot_like.csv",
              ]
              missing = [name for name in required if name not in names]
              blocked_raw = [
                  name for name in files
                  if name.startswith("XAITA-OT/data/raw/")
                  and name.lower().endswith(".csv")
                  and "/attack_lists/" not in name
              ]
              if missing:
                  raise SystemExit("Source package failed required-file check: " + ", ".join(missing))
              if blocked_raw:
                  raise SystemExit("Raw telemetry unexpectedly tracked in source package: " + ", ".join(blocked_raw[:10]))
              data = {
                  "schema_version": "XAITA-OT-SOURCE-PACKAGE-1.0",
                  "git_revision": rev,
                  "archive_sha256": hashlib.sha256(zpath.read_bytes()).hexdigest(),
                  "repository_bundle_sha256": hashlib.sha256(Path("handover-output/XAITA-OT-repository.bundle").read_bytes()).hexdigest(),
                  "tracked_file_count": len(files),
                  "included_demo_fixtures": [
                      "data/demo/swat_like.csv",
                      "data/demo/batadal_like.csv",
                      "data/demo/toniot_like.csv",
                      "data/demo/v3_phase2_swat.csv",
                  ],
                  "raw_benchmarks_included_in_source_archive": False,
                  "raw_data_note": "Git excludes full raw benchmark telemetry and private dataset ZIPs. The small tracked BATADAL attack-list metadata is included. User-supplied benchmark files are packaged locally as a separate data supplement.",
                  "required_files_check": "pass",
                  "raw_dataset_policy_check": "pass",
                  "history_bundle_check": "pass",
              }
          Path("handover-output/package-manifest.json").write_text(json.dumps(data, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps(data, indent=2))
          PY

      - name: Upload handover source and repository bundle
        uses: actions/upload-artifact@v4
        with:
          name: XAITA-OT-handover-source
          path: handover-output/*
          if-no-files-found: error
          retention-days: 30
