[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xaita-ot"
version = "0.5.0"
description = "Evidence-continuous OT/ICS threat analysis, attribution assessment and CTI platform"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = {text = "Proprietary - research prototype"}
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scikit-learn>=1.4,<2",
  "scipy>=1.12,<2",
  "joblib>=1.3,<2",
  "PyYAML>=6,<7",
  "pydantic>=2.5,<3",
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.27,<1",
  "python-multipart>=0.0.9,<1",
  "torch>=2.2,<3",
  "shap>=0.45,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1", "httpx>=0.27,<1", "matplotlib>=3.8,<4"]

[project.scripts]
xaita = "xaita_ot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
