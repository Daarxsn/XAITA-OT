<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XAITA-OT Analyst Console</title><style>body{font-family:Inter,Arial,sans-serif;background:#0b1020;color:#eef2ff;margin:0}header{padding:24px 32px;background:#111936;border-bottom:1px solid #29345d}h1{margin:0;font-size:24px}.wrap{padding:28px;max-width:1200px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}.card{background:#121a35;border:1px solid #2a3764;border-radius:14px;padding:20px}.metric{font-size:32px;font-weight:700;margin-top:8px}.muted{color:#9ba8d1}.pill{display:inline-block;padding:6px 10px;border-radius:999px;background:#1c2a52}.trace{font-family:ui-monospace,monospace;line-height:1.8}.btn{background:#5b7cfa;color:#fff;border:0;border-radius:10px;padding:10px 14px;cursor:pointer}</style></head><body><header><h1>XAITA-OT Analyst Console</h1><div class="muted">Evidence-continuous OT/ICS security analytics</div></header><div class="wrap"><div class="grid"><div class="card"><div class="muted">Detection confidence</div><div class="metric" id="dc">—</div></div><div class="card"><div class="muted">Attribution belief</div><div class="metric" id="belief">—</div></div><div class="card"><div class="muted">Risk</div><div class="metric" id="risk">—</div></div><div class="card"><div class="muted">Episodes</div><div class="metric" id="episodes">—</div></div></div><div class="card" style="margin-top:16px"><h2>Evidence Trace</h2><div class="trace" id="trace">Observation → Detection → Episode → Context → Attribution → XAI → Risk → CTI</div><p class="muted">Human validation required. No autonomous OT control actions.</p><button class="btn" onclick="runDemo()">Run local demo</button></div><pre class="card" id="json" style="margin-top:16px;overflow:auto"></pre></div><script>async function runDemo(){const now=new Date().toISOString();const ev=['reconnaissance','protocol','unauthorized_command','process_deviation'].map((label,i)=>({event_id:'e'+(i+1),timestamp:new Date(Date.now()+i*12000).toISOString(),asset:'PLC-02',protocol:'modbus',label,detection_confidence:.90+i*.02,features:{f0:1+i*.1,f1:.5}}));const r=await fetch('/v1/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(ev)});const j=await r.json();document.getElementById('json').textContent=JSON.stringify(j,null,2);const x=j.incidents?.[0];if(x){document.getElementById('dc').textContent=x.detection.mean_detection_confidence.toFixed(3);document.getElementById('belief').textContent=x.attribution.belief.toFixed(3);document.getElementById('risk').textContent=x.risk.level+' '+x.risk.score.toFixed(3);document.getElementById('episodes').textContent=j.incidents.length}}}</script></body></html>
